name: 🐍 Generate Contribution Snake

# Generates the animated contribution snake SVGs and publishes them
# to the `output` branch. The snake eats your GitHub contributions
# and renders them as a swimming animation.
#
# Docs for the underlying action: https://github.com/Platane/snk

on:
  # Run once a day to keep the snake fresh
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Re-generate whenever the workflow itself is updated
  push:
    paths:
      - ".github/workflows/snake.yml"
    branches:
      - main
      - master

jobs:
  build:
    name: 🐍 Build & deploy snake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # required to push to the `output` branch

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Nikhil00437
          # Three themes so light + dark mode visitors both get a snake
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg
            dist/github-snake-theme-other.svg

      - name: 🚀 Publish to `output` branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          force_orphan: true
          # Disable Jekyll so SVGs render with the correct MIME type
          enable_jekyll: false
