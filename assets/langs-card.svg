<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="50%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#F7DF1E"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0.75" y="0.75" width="478.5" height="198.5" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M 14 0 L 466 0 A 14 14 0 0 1 480 14 L 480 18 L 0 18 L 0 14 A 14 14 0 0 1 14 0 Z" fill="url(#accent)"/>

  <!-- Title -->
  <text x="24" y="44" font-size="15" font-weight="700" fill="#3776AB">🧬 Top Languages</text>
  <text x="24" y="62" font-size="10" fill="#8b949e">What I actually ship in</text>

  <!-- Stacked horizontal bar -->
  <g transform="translate(24, 86)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#3776AB"/>
    <rect x="220" y="0" width="100" height="22" fill="#3178C6"/>
    <rect x="320" y="0" width="56" height="22" fill="#E34C26"/>
    <rect x="376" y="0" width="32" height="22" rx="4" fill="#DA5B0B"/>
    <rect x="0" y="0" width="432" height="22" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Legend -->
  <g font-size="11" font-weight="600">
    <g transform="translate(24, 130)">
      <circle cx="6" cy="6" r="5" fill="#3776AB"/>
      <text x="18" y="10" fill="#c9d1d9">Python</text>
      <text x="80" y="10" fill="#8b949e" font-weight="500">~52%</text>
    </g>
    <g transform="translate(140, 130)">
      <circle cx="6" cy="6" r="5" fill="#3178C6"/>
      <text x="18" y="10" fill="#c9d1d9">TypeScript</text>
      <text x="100" y="10" fill="#8b949e" font-weight="500">~24%</text>
    </g>
    <g transform="translate(264, 130)">
      <circle cx="6" cy="6" r="5" fill="#E34C26"/>
      <text x="18" y="10" fill="#c9d1d9">HTML</text>
      <text x="68" y="10" fill="#8b949e" font-weight="500">~13%</text>
    </g>
    <g transform="translate(348, 130)">
      <circle cx="6" cy="6" r="5" fill="#DA5B0B"/>
      <text x="18" y="10" fill="#c9d1d9">Jupyter</text>
      <text x="76" y="10" fill="#8b949e" font-weight="500">~7%</text>
    </g>

    <text x="24" y="166" font-size="10" font-weight="500" fill="#8b949e">Other: CSS, Shell, Dockerfile, …</text>
  </g>
</svg>
