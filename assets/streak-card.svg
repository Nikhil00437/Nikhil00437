<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0.75" y="0.75" width="478.5" height="198.5" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M 14 0 L 466 0 A 14 14 0 0 1 480 14 L 480 18 L 0 18 L 0 14 A 14 14 0 0 1 14 0 Z" fill="url(#accent)"/>

  <!-- Title -->
  <text x="24" y="44" font-size="15" font-weight="700" fill="#ff6b6b">🔥 Streak &amp; Activity</text>
  <text x="24" y="62" font-size="10" fill="#8b949e">Continuous building · Daily commits</text>

  <!-- Left column: Current streak -->
  <g transform="translate(28, 110)" font-weight="700">
    <text font-size="40" fill="url(#flame)">365+</text>
    <text y="20" font-size="11" font-weight="500" fill="#c9d1d9">Day commitment era</text>
    <text y="36" font-size="9" font-weight="500" fill="#8b949e">Active since 2025</text>
  </g>

  <!-- Vertical divider -->
  <line x1="200" y1="74" x2="200" y2="184" stroke="#30363d" stroke-width="1"/>

  <!-- Top-right: Longest run -->
  <g transform="translate(220, 80)" font-weight="700">
    <text font-size="14" font-weight="500" fill="#8b949e">LONGEST RUN</text>
    <text y="24" font-size="22" fill="#ffd54a">Months on end</text>
    <text y="38" font-size="9" font-weight="500" fill="#8b949e">Flagship milestones</text>
  </g>

  <!-- Bottom-right: Cadence -->
  <g transform="translate(220, 148)" font-weight="700">
    <text font-size="14" font-weight="500" fill="#8b949e">RHYTHM</text>
    <text y="22" font-size="18" fill="#00d4aa">Ship → Reflect → Ship</text>
  </g>
</svg>
