<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0.75" y="0.75" width="478.5" height="198.5" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Top accent line -->
  <path d="M 14 0 L 466 0 A 14 14 0 0 1 480 14 L 480 18 L 0 18 L 0 14 A 14 14 0 0 1 14 0 Z" fill="url(#accent)"/>

  <!-- Title -->
  <text x="24" y="44" font-size="15" font-weight="700" fill="#8957e5">Nikhil00437 · GitHub Stats</text>
  <text x="24" y="62" font-size="10" fill="#8b949e">Local-first AI · Privacy-focused · On-device</text>

  <!-- Stats grid -->
  <g font-size="22" font-weight="700">
    <g transform="translate(24, 92)">
      <text fill="#ffd54a">⭐ 2</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Stars earned</text>
    </g>
    <g transform="translate(132, 92)">
      <text fill="#8957e5">📦 20</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Public repos</text>
    </g>
    <g transform="translate(244, 92)">
      <text fill="#00d4aa">🔀 0</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Forked</text>
    </g>
    <g transform="translate(348, 92)">
      <text fill="#1f6feb">👥 2</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Followers</text>
    </g>
    <g transform="translate(24, 144)">
      <text fill="#ff6b6b">🔥 2025–26</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Active era</text>
    </g>
    <g transform="translate(160, 144)">
      <text fill="#c9d1d9">🤝 8</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Following</text>
    </g>
    <g transform="translate(264, 144)">
      <text fill="#00d4aa">📜 MIT</text>
      <text y="16" font-size="10" font-weight="500" fill="#8b949e">Open source</text>
    </g>
