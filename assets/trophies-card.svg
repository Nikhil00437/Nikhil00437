<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0.75" y="0.75" width="478.5" height="198.5" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M 14 0 L 466 0 A 14 14 0 0 1 480 14 L 480 18 L 0 18 L 0 14 A 14 14 0 0 1 14 0 Z" fill="url(#accent)"/>

  <!-- Title -->
  <text x="24" y="44" font-size="15" font-weight="700" fill="#ffd54a">🏆 Trophies &amp; Achievements</text>
  <text x="24" y="62" font-size="10" fill="#8b949e">Milestones unlocked along the way</text>

  <!-- Trophy 1 -->
  <g transform="translate(24, 84)">
    <circle cx="20" cy="20" r="20" fill="#1a1b26" stroke="#ffd54a" stroke-width="1.5"/>
    <text x="20" y="27" font-size="20" text-anchor="middle">🏠</text>
    <text x="50" y="14" font-size="11" font-weight="700" fill="#ffd54a">Local-First</text>
    <text x="50" y="28" font-size="9" fill="#8b949e">On-device AI builds</text>
  </g>

  <!-- Trophy 2 -->
  <g transform="translate(220, 84)">
    <circle cx="20" cy="20" r="20" fill="#1a1b26" stroke="#8957e5" stroke-width="1.5"/>
    <text x="20" y="27" font-size="20" text-anchor="middle">🧠</text>
    <text x="50" y="14" font-size="11" font-weight="700" fill="#8957e5">Self-Modifier</text>
    <text x="50" y="28" font-size="9" fill="#8b949e">Code that rewrites itself</text>
  </g>

  <!-- Trophy 3 -->
  <g transform="translate(24, 138)">
    <circle cx="20" cy="20" r="20" fill="#1a1b26" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="20" y="27" font-size="20" text-anchor="middle">🎨</text>
    <text x="50" y="14" font-size="11" font-weight="700" fill="#00d4aa">Multimodal</text>
    <text x="50" y="28" font-size="9" fill="#8b949e">Text · Voice · Image</text>
  </g>

  <!-- Trophy 4 -->
  <g transform="translate(220, 138)">
    <circle cx="20" cy="20" r="20" fill="#1a1b26" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="20" y="27" font-size="20" text-anchor="middle">🚀</text>
    <text x="50" y="14" font-size="11" font-weight="700" fill="#1f6feb">Shipper</text>
    <text x="50" y="28" font-size="9" fill="#8b949e">20 repos · 0 forks</text>
  </g>
</svg>
